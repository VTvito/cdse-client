name: Publish (PyPI)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      - name: Twine check
        run: |
          python -m twine check --strict dist/*

      # Release notes are extracted and validated here, before anything is
      # published: a PyPI upload cannot be undone, so a missing or empty
      # CHANGELOG section must fail the run while that is still harmless.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # -s is not enough: an empty section yields a single newline.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section"
            exit 1
          fi
          echo "" >> notes.md
          echo "See the [full changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." >> notes.md
          cat notes.md

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  publish:
    needs: build
    # Publishing is tag-only. Without this, a workflow_dispatch from any branch
    # would push whatever cdse.__version__ happens to say to PyPI.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Lets a run that failed after the upload be retried. A version can
          # never be re-uploaded to PyPI, so the alternative is a permanently
          # unretryable workflow.
          skip-existing: true

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A release left behind by a partially failed run may be missing
            # its assets, so re-upload them rather than only refreshing notes.
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --verify-tag \
              dist/*
          fi
